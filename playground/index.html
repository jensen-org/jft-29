<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>jft-29 playground</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; font: 13px system-ui, sans-serif; display: grid; grid-template-columns: 320px 1fr; height: 100vh; }
      #tree { border-right: 1px solid #8884; min-height: 0; }
      #side { padding: 16px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
      pre { margin: 0; max-height: 50vh; overflow: auto; }
    </style>
  </head>
  <body>
    <div id="tree"></div>
    <div id="side">
      <button id="folder" type="button">Open folder</button>
      <button id="pack" type="button">Switch icon pack</button>
      <button id="theme" type="button">Toggle light and dark icons</button>
      <button id="burst" type="button">Create 1000 files in a burst</button>
      <button id="atomic" type="button">Write a file atomically</button>
      <button id="reveal" type="button">Reveal /p/src/deep/er/b.ts</button>
      <pre id="log"></pre>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
